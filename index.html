<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SkwelaDabaw - The offline-first campus companion for Davao City students. Class schedules, Davao PUJ jeepney routes, student fare matrix, Davao 911 safety hotlines, and study spots." />
    <link rel="canonical" href="https://skweladabaw.kurzyrio.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skweladabaw.kurzyrio.site/" />
    <meta property="og:title" content="SkwelaDabaw • Davao Student Campus & Transit Companion" />
    <meta property="og:description" content="Class schedules, live Davao City Bus tracking, PUJ jeepney routes, and campus safety tools for Dabawenyo students." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SkwelaDabaw • Davao Student & Jeep Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>
    <script>
      (function() {
        var theme = localStorage.getItem('skweladabaw_theme') || 'davao-classic-blue';
        var isDark = theme.indexOf('dark') !== -1 || theme.indexOf('midnight') !== -1 || theme.indexOf('oled') !== -1 || theme.indexOf('cyber') !== -1;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root">
      <div id="skwela-initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;color:#f4f4f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;user-select:none;">
        <div style="position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;border:3px solid rgba(56,189,248,0.15);"></div>
          <div style="position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#38bdf8;animation:skwelaSpin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          <div style="width:10px;height:10px;border-radius:50%;background:#38bdf8;opacity:0.85;"></div>
        </div>
        <div style="margin-top:18px;font-size:13px;font-weight:700;letter-spacing:0.02em;color:#e4e4e7;">
          Skwela<span style="color:#38bdf8;">Dabaw</span>
        </div>
      </div>
      <style>
        @keyframes skwelaSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
