name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish formal GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Configuration Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f android/app/google-services.json ]; then
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Install Node Dependencies
        run: npm ci

      - name: Compile Web Application Bundle
        run: npm run build

      - name: Synchronize Capacitor Native Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          APK_DIR="android/app/build/outputs/apk/debug"
          cp "$APK_DIR/app-debug.apk" "$APK_DIR/SkwelaDabaw-v${VERSION}.apk"
          cp "$APK_DIR/app-debug.apk" "$APK_DIR/SkwelaDabaw.apk"
          echo "Binary packages prepared for release v${VERSION}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkwelaDabaw-v${{ steps.prep.outputs.version }}-apk
          path: |
            android/app/build/outputs/apk/debug/SkwelaDabaw-v${{ steps.prep.outputs.version }}.apk
            android/app/build/outputs/apk/debug/SkwelaDabaw.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: SkwelaDabaw v${{ steps.prep.outputs.version }}
          files: |
            android/app/build/outputs/apk/debug/SkwelaDabaw-v${{ steps.prep.outputs.version }}.apk
            android/app/build/outputs/apk/debug/SkwelaDabaw.apk
          generate_release_notes: true
          draft: false
          prerelease: false
